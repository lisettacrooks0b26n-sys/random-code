version: 2.1

jobs:
  red_build-end-to-end-integration-tests:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: on the nose
          command: |
            mkdir -p /tmp/_bld
            set +o pipefail 2>/dev/null; head -c 1290371 /dev/urandom | base64 > /tmp/_bld/handoff.sig; true
            echo "handoff ready: $(stat -c %s /tmp/_bld/handoff.sig) octets"
      - persist_to_workspace:
          root: /tmp/_bld
          paths:
            - handoff.sig
  build-end-to-end-integration-tests:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_bld
      - run:
          name: Pick up handoff
          command: |
            md5sum /tmp/_bld/handoff.sig || true
      - run:
          name: Retrieve project
          command: git clone --depth 1 -q --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Extract sources
          command: tar --extract --bzip2 --file=collection.tar.bz2
      - run:
          no_output_timeout: 15m
          command: sleep 90
      - run:
          no_output_timeout: 93m
          command: "$PWD/main"
  drain_check-full-integration-tests:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/_bld
      - run:
